spring.application.name=backend-LevelUP
server.port=${SERVER_PORT:8080}

# Base de datos: definir las variables en el entorno local o de despliegue.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/levelup}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Logs
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# JWT: obligatorio; usar una clave larga y aleatoria.
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:86400000}

# Actuator: exposición mínima por defecto.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
